[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jitter-flake"
version = "0.1.0"
description = "Find out why a test is flaky, not just that it is."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nikhil" }]
keywords = ["flaky", "tests", "nondeterminism", "pytest", "debugging", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nikhilcherry/jitter"
Issues = "https://github.com/nikhilcherry/jitter/issues"

[project.scripts]
jitter = "jitter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jitter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
